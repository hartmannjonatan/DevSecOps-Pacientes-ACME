title = "Pacientes ACME — Secret Detection"

[extend]
useDefault = true

# Explicit coverage for Symfony's application signing secret, including hex values.
[[rules]]
id = "symfony-app-secret"
description = "Literal Symfony APP_SECRET with at least 32 hexadecimal characters"
regex = '''(?i)APP_SECRET\s*[=:]\s*["']?([a-f0-9]{32,})'''
secretGroup = 1
keywords = ["APP_SECRET"]
