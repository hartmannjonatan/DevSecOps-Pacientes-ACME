name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Controlled demonstration (fixtures/errors fail; corrected scenarios pass)'
        type: choice
        default: normal
        options:
          - normal
          - secret-fixture
          - operational-failure
          - sca-operational-failure
          - sast-fixture
          - sast-corrected
          - sast-operational-failure
          - iac-fixture
          - iac-corrected
          - iac-operational-failure

permissions:
  contents: read

jobs:
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan files and history and apply policy
        run: scripts/security/scan
      - name: Controlled failure demonstration
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.scenario == 'secret-fixture' || inputs.scenario == 'operational-failure') }}
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: python3 scripts/security/demo.py "$SCENARIO"
      - name: Preserve sanitized evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-detection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/secrets/result.json
            artifacts/security/demo/result.json
          if-no-files-found: error
          retention-days: 14

  sca:
    name: SCA (${{ matrix.ecosystem }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [composer, npm]
    steps:
      - name: Checkout dependencies
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate lockfile, audit dependencies and apply contextual policy
        run: scripts/security/sca --ecosystem '${{ matrix.ecosystem }}'
      - name: Demonstrate unavailable npm advisory service
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.ecosystem == 'npm' && github.event_name == 'workflow_dispatch' && inputs.scenario == 'sca-operational-failure' }}
        run: scripts/security/sca --ecosystem npm --offline-demo --output artifacts/security/sca-demo
      - name: Preserve SCA evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca-${{ matrix.ecosystem }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/sca/${{ matrix.ecosystem }}/
            artifacts/security/sca-demo/
          if-no-files-found: error
          retention-days: 14

  sast:
    name: SAST (PHP and React)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze source with pinned Semgrep rules and apply policy
        run: scripts/security/sast
      - name: Demonstrate SAST detection, correction or operational failure
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.scenario == 'sast-fixture' || inputs.scenario == 'sast-corrected' || inputs.scenario == 'sast-operational-failure') }}
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: python3 scripts/security/sast_demo.py "$SCENARIO"
      - name: Preserve SAST evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/sast/
            artifacts/security/sast-demo/
          if-no-files-found: error
          retention-days: 14

  iac:
    name: IaC (Dockerfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout infrastructure
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze Dockerfile and validate the Compose build target
        run: scripts/security/iac
      - name: Demonstrate IaC detection, correction or operational failure
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.scenario == 'iac-fixture' || inputs.scenario == 'iac-corrected' || inputs.scenario == 'iac-operational-failure') }}
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: python3 scripts/security/iac_demo.py "$SCENARIO"
      - name: Preserve IaC evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iac-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/iac/
            artifacts/security/iac-demo/
          if-no-files-found: error
          retention-days: 14

  policy-tests:
    name: Security policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the real scanner and failure handling in isolated repositories
        run: python3 -m unittest discover -s tests/security -v
      - name: Preserve controlled before/after evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security/controls/
          if-no-files-found: error
          retention-days: 14

  security-gate:
    name: Security gate
    if: ${{ always() }}
    needs: [secret-detection, sca, sast, iac, policy-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful scans and control tests
        env:
          SECRET_DETECTION_RESULT: ${{ needs.secret-detection.result }}
          POLICY_TESTS_RESULT: ${{ needs.policy-tests.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          IAC_RESULT: ${{ needs.iac.result }}
        run: |
          printf 'Secret Detection: %s\nSCA: %s\nSAST: %s\nIaC: %s\nPolicy tests: %s\n' "$SECRET_DETECTION_RESULT" "$SCA_RESULT" "$SAST_RESULT" "$IAC_RESULT" "$POLICY_TESTS_RESULT"
          test "$SECRET_DETECTION_RESULT" = success
          test "$SCA_RESULT" = success
          test "$SAST_RESULT" = success
          test "$IAC_RESULT" = success
          test "$POLICY_TESTS_RESULT" = success
